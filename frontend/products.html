<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos de impresión MegaPrint: mantas vinílicas, stickers, rótulos 3D, carteles, adhesivos y más.">
  <title>Productos — MegaPrint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- Page Hero -->
  <section style="padding:8rem 0 4rem;background:linear-gradient(135deg,#0a0a0a,#1a0a12);position:relative;overflow:hidden;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(233,30,140,.12),transparent 60%);pointer-events:none;"></div>
    <div class="container" style="position:relative;z-index:1;">
      <div class="reveal">
        <span class="section-badge">Catálogo Completo</span>
        <h1 class="section-title" style="margin-top:.75rem;">Nuestros <span class="highlight-yellow">Productos</span></h1>
        <p class="section-subtitle" style="margin:0;">Explora toda nuestra línea de productos de impresión y publicidad profesional.</p>
      </div>
    </div>
  </section>

  <!-- Filters & Search -->
  <section style="padding:2.5rem 0;background:var(--color-black-soft);border-bottom:1px solid var(--color-black-border);position:sticky;top:70px;z-index:100;backdrop-filter:blur(10px);">
    <div class="container">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.5rem;margin-bottom:1.25rem;">
        <!-- Search -->
        <div class="search-box" style="flex:1;max-width:380px;">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="product-search" placeholder="Buscar productos...">
        </div>
        <p id="products-count" style="color:var(--color-white-muted);font-size:.875rem;"></p>
      </div>
      <!-- Category chips -->
      <div class="filter-chips" id="category-chips">
        <button class="filter-chip active" data-id="">Todos</button>
      </div>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="section">
    <div class="container">
      <div class="grid-products" id="products-grid"></div>
      <div id="products-pagination"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Products.init();
    });
  </script>
</body>
</html>
