<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador — MegaPrint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>

  <!-- ══ LOGIN SCREEN ══ -->
  <div id="login-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gradient-hero);padding:1rem;position:relative;overflow:hidden;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(233,30,140,.15),transparent 60%);pointer-events:none;"></div>
    <div style="width:100%;max-width:420px;position:relative;z-index:1;">
      <div style="text-align:center;margin-bottom:2rem;">
        <div style="font-size:2.5rem;font-weight:900;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">MEGAPRINT</div>
        <p style="color:rgba(255,255,255,.5);font-size:.875rem;margin-top:.4rem;">Panel de Administración</p>
      </div>
      <div class="card" style="padding:2.5rem;">
        <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:1.75rem;text-align:center;">Iniciar Sesión</h2>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-control" name="email" type="email" required value="admin@megaprint.bo" placeholder="admin@megaprint.bo">
          </div>
          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input class="form-control" name="password" type="password" required value="password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;">Ingresar al Panel</button>
        </form>
      </div>
      <p style="text-align:center;margin-top:1.5rem;font-size:.8rem;color:rgba(255,255,255,.3);">
        <a href="index.html" style="color:rgba(255,255,255,.4);">← Volver al sitio</a>
      </p>
    </div>
  </div>

  <!-- ══ ADMIN APP ══ -->
  <div id="admin-app" style="display:none;" class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-logo">
        <div style="font-size:1.4rem;font-weight:900;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">MEGAPRINT</div>
        <p style="font-size:.75rem;color:rgba(255,255,255,.3);margin-top:.2rem;">Panel Admin</p>
      </div>

      <nav class="admin-nav">
        <div class="admin-nav-item active" data-section="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </div>
        <div class="admin-nav-item" data-section="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
          Productos
        </div>
        <div class="admin-nav-item" data-section="categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/></svg>
          Categorías
        </div>
        <div class="admin-nav-item" data-section="jobs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          Trabajos
        </div>
        <div class="admin-nav-item" data-section="testimonials">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Testimonios
        </div>
        <div class="admin-nav-item" data-section="contacts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Mensajes
        </div>
      </nav>

      <div style="padding:1.5rem;border-top:1px solid var(--color-black-border);margin-top:auto;">
        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;">
          <div style="width:38px;height:38px;border-radius:50%;background:var(--gradient-accent);display:flex;align-items:center;justify-content:center;font-size:1rem;">👤</div>
          <div>
            <p style="font-size:.875rem;font-weight:600;">Administrador</p>
            <p style="font-size:.75rem;color:rgba(255,255,255,.4);">admin@megaprint.bo</p>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost" style="width:100%;font-size:.8rem;gap:.5rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar Sesión
        </button>
        <a href="index.html" class="btn btn-ghost" style="width:100%;font-size:.8rem;margin-top:.5rem;">← Ver sitio</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div id="admin-content">
        <!-- Loaded by admin.js -->
      </div>
    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
