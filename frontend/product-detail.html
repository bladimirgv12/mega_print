<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle del producto de impresión MegaPrint - galería, características, materiales y cotización.">
  <title>Producto — MegaPrint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <style>
    .thumb-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin-top:.75rem; }
    .thumb { width:100%; aspect-ratio:1; object-fit:cover; border-radius:.5rem; cursor:pointer; border:2px solid transparent; transition:all .2s; }
    .thumb.active, .thumb:hover { border-color:var(--color-fuchsia); }
    .related-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.25rem; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- Breadcrumb -->
  <div style="padding:5.5rem 0 0;background:var(--color-black-soft);border-bottom:1px solid var(--color-black-border);">
    <div class="container" style="padding-bottom:1rem;">
      <nav style="display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--color-white-muted);">
        <a href="index.html" style="color:var(--color-white-muted);">Inicio</a>
        <span>›</span>
        <a href="products.html" style="color:var(--color-white-muted);">Productos</a>
        <span>›</span>
        <span id="breadcrumb-name" style="color:var(--color-white);">Cargando...</span>
      </nav>
    </div>
  </div>

  <!-- Product Detail -->
  <section class="section">
    <div class="container">
      <div id="product-detail-content">
        <!-- Skeleton -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;">
          <div>
            <div class="skeleton" style="aspect-ratio:4/3;border-radius:var(--radius-lg);"></div>
            <div class="thumb-grid" style="margin-top:.75rem;">
              ${[...Array(4)].map(() => `<div class="skeleton" style="aspect-ratio:1;border-radius:.5rem;"></div>`).join('')}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:1rem;">
            <div class="skeleton" style="height:16px;width:40%;border-radius:4px;"></div>
            <div class="skeleton" style="height:36px;width:80%;border-radius:4px;"></div>
            <div class="skeleton" style="height:14px;width:100%;border-radius:4px;"></div>
            <div class="skeleton" style="height:14px;width:90%;border-radius:4px;"></div>
            <div class="skeleton" style="height:48px;width:60%;border-radius:100px;margin-top:1rem;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="section" style="background:var(--color-black-soft);" id="related-section" style="display:none;">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title" style="font-size:1.75rem;">Productos <span class="highlight-fuchsia">Relacionados</span></h2>
      </div>
      <div class="related-grid" id="related-grid"></div>
    </div>
  </section>

  <!-- Quote Modal -->
  <div class="modal-overlay" id="quote-modal">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <h3 class="modal-title">Solicitar Cotización</h3>
        <button class="modal-close" onclick="Modal.close('quote-modal')">✕</button>
      </div>
      <form id="quote-form">
        <input type="hidden" name="subject" id="quote-subject">
        <div class="form-group">
          <label class="form-label">Tu Nombre *</label>
          <input class="form-control" name="name" required placeholder="Nombre completo">
          <span class="form-error" data-error="name"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-control" name="email" type="email" required placeholder="tu@email.com">
          <span class="form-error" data-error="email"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono / WhatsApp</label>
          <input class="form-control" name="phone" placeholder="+591 77712345">
        </div>
        <div class="form-group">
          <label class="form-label">Detalles de tu pedido *</label>
          <textarea class="form-control" name="message" required rows="4" placeholder="Describe las medidas, cantidad, colores, y cualquier detalle importante..."></textarea>
          <span class="form-error" data-error="message"></span>
        </div>
        <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem;">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('quote-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="quote-submit">Enviar Cotización</button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    const WHATSAPP = '59177712345';
    let currentImages = [];
    let activeThumb = 0;

    function setMainImage(src, index) {
      document.getElementById('main-product-img').src = src;
      activeThumb = index;
      document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
    }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = 'products.html'; return; }

      try {
        const res = await API.Products.getById(id);
        const p = res.data || res;

        document.title = `${p.name} — MegaPrint`;
        document.getElementById('breadcrumb-name').textContent = p.name;
        document.querySelector('meta[name="description"]').content = p.description?.slice(0, 155) || '';

        currentImages = (p.images || []).map(i => API.getImageUrl(i.path));
        if (!currentImages.length) currentImages = ['assets/images/placeholder.jpg'];

        const whatsappMsg = `Hola! Me interesa cotizar: ${p.name}`;

        document.getElementById('product-detail-content').innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;">
            <!-- Gallery -->
            <div class="reveal-left">
              <div class="img-overlay" style="border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;"
                   onclick="Lightbox.open(currentImages, activeThumb)">
                <img id="main-product-img" src="${currentImages[0]}" alt="${p.name}"
                     style="width:100%;height:100%;object-fit:cover;transition:transform .5s ease;"
                     onerror="this.src='assets/images/placeholder.jpg'">
                <div class="overlay-icon">
                  <svg width="22" height="22" fill="white" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
              </div>
              ${currentImages.length > 1 ? `
                <div class="thumb-grid">
                  ${currentImages.map((img, i) => `
                    <img class="thumb ${i===0?'active':''}" src="${img}" alt="Imagen ${i+1}"
                         onclick="setMainImage('${img}', ${i})"
                         onerror="this.src='assets/images/placeholder.jpg'">
                  `).join('')}
                </div>` : ''}
            </div>

            <!-- Info -->
            <div class="reveal-right">
              ${p.category ? `<span class="badge badge-fuchsia" style="margin-bottom:.75rem;">${p.category.name}</span>` : ''}
              <h1 style="font-size:2rem;font-weight:800;line-height:1.2;margin-bottom:1rem;">${p.name}</h1>
              ${p.price ? `<p style="font-size:1.75rem;font-weight:800;color:var(--color-yellow);margin-bottom:1rem;">Desde Bs. ${p.price}</p>` : ''}
              <p style="color:rgba(255,255,255,.75);line-height:1.8;margin-bottom:1.5rem;">${p.description || ''}</p>

              ${p.materials ? `
                <div style="background:rgba(255,255,255,.04);border:1px solid var(--color-black-border);border-radius:var(--radius-md);padding:1rem;margin-bottom:1.5rem;">
                  <p style="font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fuchsia);margin-bottom:.4rem;">Materiales</p>
                  <p style="color:rgba(255,255,255,.7);font-size:.9rem;">${p.materials}</p>
                </div>` : ''}

              ${p.features ? `
                <div style="margin-bottom:1.5rem;">
                  <p style="font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-yellow);margin-bottom:.75rem;">Características</p>
                  <ul style="display:flex;flex-direction:column;gap:.4rem;">
                    ${p.features.split('\n').filter(Boolean).map(f => `
                      <li style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:rgba(255,255,255,.7);">
                        <span style="color:var(--color-fuchsia);">✓</span> ${f}
                      </li>`).join('')}
                  </ul>
                </div>` : ''}

              <div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem;">
                <button class="btn btn-primary btn-lg" onclick="openQuoteModal('${p.name}')">
                  Solicitar Cotización
                </button>
                <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(whatsappMsg)}" target="_blank" class="btn btn-yellow btn-lg">
                  <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                  WhatsApp
                </a>
              </div>
            </div>
          </div>
        `;

        // Load related
        loadRelated(p.category_id, p.id);
      } catch (err) {
        document.getElementById('product-detail-content').innerHTML = `
          <div style="text-align:center;padding:4rem 0;">
            <p style="font-size:3rem;margin-bottom:1rem;">😕</p>
            <h2>Producto no encontrado</h2>
            <a href="products.html" class="btn btn-primary" style="margin-top:1.5rem;">Ver catálogo</a>
          </div>
        `;
      }
    }

    async function loadRelated(categoryId, excludeId) {
      try {
        const params = { per_page: 4 };
        if (categoryId) params.category_id = categoryId;
        const res = await API.Products.getAll(params);
        const items = (res.data || []).filter(p => p.id != excludeId).slice(0, 4);
        if (!items.length) return;
        document.getElementById('related-section').style.display = 'block';
        document.getElementById('related-grid').innerHTML = items.map(Products.renderCard).join('');
        ScrollReveal.init();
      } catch (_) {}
    }

    function openQuoteModal(productName) {
      document.getElementById('quote-subject').value = `Cotización: ${productName}`;
      Modal.open('quote-modal');
    }

    document.getElementById('quote-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateForm(e.target)) return;
      const btn = document.getElementById('quote-submit');
      btn.disabled = true; btn.textContent = 'Enviando...';
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      try {
        await API.Contacts.send(data);
        Toast.success('¡Cotización enviada! Te contactaremos pronto.');
        Modal.close('quote-modal');
        e.target.reset();
      } catch (err) {
        Toast.error(err.message);
      } finally { btn.disabled = false; btn.textContent = 'Enviar Cotización'; }
    });

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
